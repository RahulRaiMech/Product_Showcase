<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Product Viewer</title>
  
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  
  <style>
    body { 
      margin: 0; 
      padding: 0; 
      background-color: #f4f4f4; 
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    /* Make the viewer take up the whole mobile screen */
    model-viewer { 
      width: 100%; 
      height: 100%; 
    }
  </style>
</head>
<body>

  <model-viewer
    src="Coimbatore_Public_School.glb"
    ios-src="product.usdz"
    alt="A 3D model of our product"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate>
  </model-viewer>

</body>
</html>
